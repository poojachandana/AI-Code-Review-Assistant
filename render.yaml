databases:
  - name: aicodereview-db
    databaseName: aicodereview
    user: aicodereview
    plan: free

services:
  - type: web
    name: aicodereview-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: aicodereview-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: aicodereview-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: aicodereview-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: aicodereview-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: aicodereview-db
          property: password
      - key: APP_JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: aicodereview-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
