spring.application.name=ai-code-review-assistant
server.port=${PORT:8080}

# ------------------------------------------------------------------
# DATABASE
# ------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/aicodereview;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------
# FILE UPLOAD
# ------------------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads
app.report.dir=reports

# ------------------------------------------------------------------
# JWT
# ------------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:ChangeThisSecretKeyToSomethingLongAndRandomForProductionUse123456}
app.jwt.expiration-ms=86400000

# ------------------------------------------------------------------
# AI PROVIDER
# Set GROQ_API_KEY (or GEMINI_API_KEY) as an environment variable —
# never hardcode real keys here.
# ------------------------------------------------------------------
app.ai.provider.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
app.ai.provider.api-key=${GROQ_API_KEY:${GEMINI_API_KEY:${OPENAI_API_KEY:}}}
app.ai.provider.model=${AI_MODEL:llama-3.3-70b-versatile}

# ------------------------------------------------------------------
# CORS
# ------------------------------------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ------------------------------------------------------------------
# ADMIN BOOTSTRAP
# ------------------------------------------------------------------
app.admin.emails=

# ------------------------------------------------------------------
# EMAIL NOTIFICATIONS
# ------------------------------------------------------------------
app.email.enabled=true
app.email.from=${MAIL_USERNAME:no-reply@aicodereview.local}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true